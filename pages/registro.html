<body>
    <header>
        <nav>
            <section>
                    <h1>
                        <a href="/index.html">
                            <img src="imagenes/logo.webp" alt="Warframe Logo" class="logo">

            <section>
                <a href="#">placeholder1</a>

    <main class="login-main">
        <form id="loginillo" novalidate>
 


            <div class="registro-container" id="contenedor-registro" hidden>
                <h2 class="registro-titulo">Registrarse</h2>
 
                <label for="correo-registro">Correo Electronico</label>
                <input type="email" id="correo-registro" name="correo" placeholder="Ingrese Correo" autocomplete="email">
                <input type="password" id="contraseña-registro" name="contraseña" placeholder="Ingrese Contraseña" autocomplete="new-password">
                <input type="password" id="confirmar-contraseña-registro" name="confirmar-contraseña" placeholder="Confirmar Contraseña" autocomplete="new-password">
                <p class="error-registro" id="registro-error"></p>
                <p class="exito-registro" id="registro-exito"></p>
 
                <button type="submit">Registrarse</button>
 
                <p class="auth-switch">¿Ya tiene cuenta? <a href="../pages/login.html" id="ir-a-login">Inicia sesión aqui</a></p>
            </div>
 
        </form>
    </main>
        

    <footer class="piepagina">
        <h4>BASURA KI'TEER</h4>
        <p>Parodia sin fines de lucro, los mejores productos del vacio.</p>
        <p>Contacto: soporte@basurakiteer.cl</p>
    </footer>

</body>
